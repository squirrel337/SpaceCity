name: Game builds (Windows · Android · macOS)

# game/ 폴더의 Godot 프로젝트를 시험하고 Windows exe, Android APK, macOS 앱(universal, ad-hoc 서명)으로 내보낸다.
# 빌드는 실행 결과 페이지의 Artifacts에서 받는다. 수동 실행에서 publish를 켜면
# 'prototype-latest' 프리릴리스에 파일을 올린다 (휴대폰 브라우저로 APK를 바로 받을 수 있다).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "prototype-latest 프리릴리스에 올리기"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths:
      - "game/**"
      - "!game/**/*.md"
      - "docs/design/data/**"
      - "docs/design/sim/**"
      - ".github/workflows/game-builds.yml"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-win-android-mac

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -sSfL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/windows_*' 'templates/android_*' 'templates/macos.zip' 'templates/version.txt' -d "$dest"
          ls -la "$dest"

      - name: Put Godot on PATH
        run: |
          sudo ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --path game --import

      - name: Data copy matches design docs
        run: python3 game/tools/sync_data.py

      - name: Art matches its generator
        run: python3 game/tools/art/make_art.py --check

      - name: Same results as the Python balance simulator
        run: python3 game/tools/parity_check.py --godot godot --seeds 2061 1000 --years 3

      - name: Smoke test
        run: |
          godot --headless --path game --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          grep -q "smoke: OK" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log

      - name: Debug keystore for the APK
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path game --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/SpaceCity.exe"
          test -s build/windows/SpaceCity.exe
          ls -la build/windows

      - name: Export Android
        run: |
          mkdir -p build/android
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/android/SpaceCity.apk"
          test -s build/android/SpaceCity.apk

      # Linux에서 만든다: 실행 파일은 Godot 내장 서명기로 ad-hoc 서명 (Apple Silicon은 서명 없는 실행 파일을 돌리지 않는다).
      # 공증은 없어서 처음 열 때 Gatekeeper를 한 번 넘겨야 한다 — 프리릴리스 설명에 방법을 적는다
      - name: Export macOS
        run: |
          mkdir -p build/macos
          godot --headless --path game --export-release "macOS" "$GITHUB_WORKSPACE/build/macos/SpaceCity.zip"
          python3 game/tools/macos_check.py build/macos/SpaceCity.zip

      - name: Package
        run: |
          cd build
          (cd windows && zip -q -9 -r ../SpaceCity-windows-x86_64.zip .)
          cp android/SpaceCity.apk SpaceCity-android.apk
          cp macos/SpaceCity.zip SpaceCity-macos-universal.zip
          ls -la . windows

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceCity-windows-x86_64
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceCity-android
          path: build/SpaceCity-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceCity-macos-universal
          path: build/SpaceCity-macos-universal.zip

      - name: Publish prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prototype-latest --yes --cleanup-tag || true
          gh release create prototype-latest build/SpaceCity-windows-x86_64.zip build/SpaceCity-android.apk \
            build/SpaceCity-macos-universal.zip \
            --prerelease --target "$GITHUB_SHA" --title "SpaceCity 프로토타입 (최신 빌드)" --notes-file - <<NOTES
          시대 0 프로토타입 · 커밋 ${GITHUB_SHA::7}

          - **Windows 10/11 (64비트)** — \`SpaceCity-windows-x86_64.zip\`을 풀고 \`SpaceCity.exe\`를 실행한다. 코드 서명이 없어서 SmartScreen이 막으면 '추가 정보 → 실행'.
          - **macOS 11 이상 (Intel · Apple Silicon 공용, Apple Silicon은 macOS 13 이상)** — \`SpaceCity-macos-universal.zip\`을 풀고 \`SpaceCity.app\`을 응용 프로그램 폴더로 옮긴다. 공증하지 않은 앱(ad-hoc 서명)이라 처음 한 번은 터미널에서 \`xattr -dr com.apple.quarantine /Applications/SpaceCity.app\`를 실행한 뒤 연다. 또는 한 번 열어 본 다음 시스템 설정 → 개인정보 보호 및 보안 → '그래도 열기'.
          - **Android 7.0 이상** — \`SpaceCity-android.apk\`를 설치한다 ('출처를 알 수 없는 앱' 허용, 디버그 서명).
          NOTES
